<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kids Player — Cyril & Methodius Media</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1b1b1e;
      --border: #2e2e34;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 6rem;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem; }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: var(--accent);
      margin: 0.5rem 0 1.5rem;
    }
    .btn-shuffle {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }
    .btn-shuffle:hover { background: var(--accent-hover); }
    .album-heading {
      font-size: 1rem;
      color: var(--muted);
      margin: 1.5rem 0 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .track-row.playing { border-color: var(--accent); }
    .track-title { font-size: 0.95rem; }
    .track-play-icon { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    .loading, .empty { text-align: center; color: var(--muted); padding: 2rem 0; }

    .now-playing-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(27, 27, 30, 0.97);
      border-top: 1px solid var(--accent);
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      display: none;
      align-items: center;
      gap: 0.75rem;
    }
    .now-playing-bar.visible { display: flex; }
    .np-title {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-controls { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .btn-np {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-np-toggle {
      background: var(--accent);
      color: #000;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body oncontextmenu="return false">

  <div class="container">
    <h1>✝ Kids Player</h1>
    <button class="btn-shuffle" onclick="playRandomTrack()">🔀 Play Something</button>
    <div id="track-list">
      <div class="loading">Loading songs…</div>
    </div>
  </div>

  <div class="now-playing-bar" id="now-playing-bar">
    <div class="np-title" id="np-title">—</div>
    <div class="np-controls">
      <button class="btn-np" onclick="playPrevTrack()">⏮</button>
      <button class="btn-np-toggle" id="btn-np-toggle" onclick="toggleNowPlaying()">⏸</button>
      <button class="btn-np" onclick="playNextTrack()">⏭</button>
    </div>
  </div>

  <audio id="audio" controlsList="nodownload noplaybackrate" oncontextmenu="return false"></audio>

  <script>
    const MEDIA_BASE = "https://media.methodius.media";
    const CATALOG_URL = `${MEDIA_BASE}/catalog.json`;

    const audio = document.getElementById('audio');
    let songs = [];
    let currentIndex = -1;

    function loadCatalog() {
      fetch(CATALOG_URL)
        .then(res => res.json())
        .then(catalogData => {
          songs = [];
          catalogData.forEach(album => {
            const albumName = album.albumName || "Songs";
            if (album.tracks && album.tracks.length > 0) {
              album.tracks.forEach(t => {
                songs.push({
                  title: t.title || "Untitled",
                  album: albumName,
                  url: `${MEDIA_BASE}/${encodeURI(t.path)}`
                });
              });
            }
          });
          renderTracks();
        })
        .catch(() => {
          document.getElementById('track-list').innerHTML = '<div class="empty">Couldn\'t load songs right now.</div>';
        });
    }

    function renderTracks() {
      const listEl = document.getElementById('track-list');
      if (songs.length === 0) {
        listEl.innerHTML = '<div class="empty">No songs found.</div>';
        return;
      }

      let html = '';
      let lastAlbum = null;
      songs.forEach((song, i) => {
        if (song.album !== lastAlbum) {
          html += `<div class="album-heading">${song.album}</div>`;
          lastAlbum = song.album;
        }
        html += `
          <div class="track-row" id="track-row-${i}" onclick="playTrackByIndex(${i})">
            <span class="track-title">${song.title}</span>
            <span class="track-play-icon">▶</span>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    function playTrackByIndex(i) {
      if (i < 0 || i >= songs.length) return;
      document.querySelectorAll('.track-row.playing').forEach(el => el.classList.remove('playing'));
      const row = document.getElementById(`track-row-${i}`);
      if (row) {
        row.classList.add('playing');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      currentIndex = i;
      audio.src = songs[i].url;
      audio.play();

      document.getElementById('np-title').textContent = songs[i].title;
      document.getElementById('now-playing-bar').classList.add('visible');
      document.getElementById('btn-np-toggle').textContent = '⏸';
    }

    function playRandomTrack() {
      if (songs.length === 0) return;
      const randomIdx = Math.floor(Math.random() * songs.length);
      playTrackByIndex(randomIdx);
    }

    function playNextTrack() {
      if (songs.length === 0) return;
      playTrackByIndex((currentIndex + 1) % songs.length);
    }

    function playPrevTrack() {
      if (songs.length === 0) return;
      playTrackByIndex((currentIndex - 1 + songs.length) % songs.length);
    }

    function toggleNowPlaying() {
      if (currentIndex === -1) {
        playRandomTrack();
        return;
      }
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    audio.addEventListener('play', () => {
      document.getElementById('btn-np-toggle').textContent = '⏸';
    });
    audio.addEventListener('pause', () => {
      document.getElementById('btn-np-toggle').textContent = '▶';
    });
    audio.addEventListener('ended', playNextTrack);

    loadCatalog();
  </script>
</body>
</html>
