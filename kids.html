<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kids Player — Cyril & Methodius Media</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/kids.webmanifest" />
  <meta name="theme-color" content="#121214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Methodius Player" />
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1b1b1e;
      --border: #2e2e34;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 6rem;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem; }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: var(--accent);
      margin: 0.5rem 0 1.5rem;
    }
    .btn-shuffle {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }
    .btn-shuffle:hover { background: var(--accent-hover); }

    .album-card { margin-bottom: 2rem; }
    .album-art {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .album-art-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .album-art-symbol { font-size: 3rem; color: var(--accent); }
    .album-art-play-overlay {
      position: absolute;
      bottom: 0.75rem;
      right: 0.75rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      pointer-events: none;
    }
    .album-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .track-row.playing { border-color: var(--accent); }
    .track-title { font-size: 0.95rem; }
    .track-play-icon { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    .loading, .empty { text-align: center; color: var(--muted); padding: 2rem 0; }

    .now-playing-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(27, 27, 30, 0.97);
      border-top: 1px solid var(--accent);
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      display: none;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      z-index: 10;
    }
    .now-playing-bar.visible { display: flex; }
    .np-title {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-controls { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .btn-np {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-np-toggle {
      background: var(--accent);
      color: #000;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .big-player {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem calc(6rem + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      z-index: 50;
    }
    .big-player.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .big-player-close {
      position: absolute;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.75rem 1.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .big-player-art {
      width: min(75vw, 340px);
      height: min(75vw, 340px);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .big-player-art .album-art-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .big-player-art .album-art-symbol { font-size: 5rem; color: var(--accent); }
    .big-player-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.35rem;
      padding: 0 1rem;
    }
    .big-player-album {
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 0 1rem;
    }
    .big-player-controls { display: flex; align-items: center; gap: 1.5rem; }
    .btn-big {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .btn-big-toggle {
      background: var(--accent);
      color: #000;
      border: none;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body oncontextmenu="return false">

  <div class="container">
    <h1>✝ Methodius Media</h1>
    <button class="btn-shuffle" onclick="playRandomTrack()">🔀 Play Something</button>
    <div id="track-list">
      <div class="loading">Loading songs…</div>
    </div>
  </div>

  <div class="now-playing-bar" id="now-playing-bar" onclick="expandBigPlayer()">
    <div class="np-title" id="np-title">—</div>
    <div class="np-controls">
      <button class="btn-np" onclick="event.stopPropagation(); playPrevTrack()">⏮</button>
      <button class="btn-np-toggle" id="btn-np-toggle" onclick="event.stopPropagation(); toggleNowPlaying()">⏸</button>
      <button class="btn-np" onclick="event.stopPropagation(); playNextTrack()">⏭</button>
      <button class="btn-np" onclick="event.stopPropagation(); playRandomTrack()">🔀</button>
    </div>
  </div>

  <div class="big-player" id="big-player">
    <button class="big-player-close" onclick="collapseBigPlayer()" aria-label="Close">✕ Close</button>
    <div class="big-player-art" id="big-player-art">
      <img id="big-art-img" class="album-art-img" alt="" style="display: none;" />
      <span id="big-art-symbol" class="album-art-symbol">✝</span>
    </div>
    <div class="big-player-title" id="big-player-title">—</div>
    <div class="big-player-album" id="big-player-album"></div>
    <div class="big-player-controls">
      <button class="btn-big" onclick="playPrevTrack()">⏮</button>
      <button class="btn-big-toggle" id="btn-big-toggle" onclick="toggleNowPlaying()">⏸</button>
      <button class="btn-big" onclick="playNextTrack()">⏭</button>
    </div>
  </div>

  <audio id="audio" controlsList="nodownload noplaybackrate" oncontextmenu="return false"></audio>

  <script>
    const MEDIA_BASE = "https://media.methodius.media";
    const CATALOG_URL = `${MEDIA_BASE}/catalog.json`;

    // Deterministic placeholder color for albums with no cover art yet --
    // same album always gets the same color.
    const ART_PALETTE = [
      "212, 175, 55",
      "150, 30, 45",
      "106, 27, 154",
      "40, 94, 68",
      "58, 90, 140",
      "176, 120, 60"
    ];

    function albumArtColor(seed) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      }
      return ART_PALETTE[hash % ART_PALETTE.length];
    }

    function albumArtBackground(seed) {
      const rgb = albumArtColor(seed);
      return `linear-gradient(160deg, rgba(${rgb}, 0.35), rgba(${rgb}, 0.08))`;
    }

    // Strip embedded [sung]/[spoken] tags and [2026]-style year tags from
    // catalog names -- kids just see the plain title, no badges.
    function stripTags(raw) {
      return (raw || "")
        .replace(/\s*\[(sung|spoken)\]|\s*\((sung|spoken)\)/gi, '')
        .replace(/\s*\[\d{4}\]|\s*\(\d{4}\)/g, '')
        .trim();
    }

    const audio = document.getElementById('audio');
    let songs = [];
    let albums = [];
    let currentIndex = -1;

    function loadCatalog() {
      fetch(CATALOG_URL)
        .then(res => res.json())
        .then(catalogData => {
          songs = [];
          albums = [];
          catalogData.forEach(album => {
            if (!album.tracks || album.tracks.length === 0) return;
            const albumName = stripTags(album.albumName) || "Songs";
            const coverArt = album.coverArt ? `${MEDIA_BASE}/${encodeURI(album.coverArt)}` : null;
            const albumEntry = { name: albumName, coverArt, trackIndexes: [] };
            album.tracks.forEach(t => {
              albumEntry.trackIndexes.push(songs.length);
              songs.push({
                title: stripTags(t.title) || "Untitled",
                album: albumName,
                coverArt,
                url: `${MEDIA_BASE}/${encodeURI(t.path)}`
              });
            });
            albums.push(albumEntry);
          });
          renderTracks();
        })
        .catch(() => {
          document.getElementById('track-list').innerHTML = '<div class="empty">Couldn\'t load songs right now.</div>';
        });
    }

    function renderTracks() {
      const listEl = document.getElementById('track-list');
      if (songs.length === 0) {
        listEl.innerHTML = '<div class="empty">No songs found.</div>';
        return;
      }

      listEl.innerHTML = albums.map(album => {
        const bg = albumArtBackground(album.name);
        const firstTrackIndex = album.trackIndexes[0];
        const artHtml = album.coverArt
          ? `<img class="album-art-img" src="${album.coverArt}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
             <span class="album-art-symbol" style="display: none;">✝</span>`
          : `<span class="album-art-symbol">✝</span>`;

        const tracksHtml = album.trackIndexes.map(i => `
          <div class="track-row" id="track-row-${i}" onclick="playTrackByIndex(${i})">
            <span class="track-title">${songs[i].title}</span>
            <span class="track-play-icon">▶</span>
          </div>
        `).join('');

        return `
          <div class="album-card">
            <div class="album-art" style="background: ${bg};" onclick="playTrackByIndex(${firstTrackIndex})">
              ${artHtml}
              <span class="album-art-play-overlay">▶</span>
            </div>
            <div class="album-name">${album.name}</div>
            <div class="album-tracks">${tracksHtml}</div>
          </div>
        `;
      }).join('');
    }

    function setBigPlayerArt(song) {
      const artEl = document.getElementById('big-player-art');
      const img = document.getElementById('big-art-img');
      const symbol = document.getElementById('big-art-symbol');

      artEl.style.background = albumArtBackground(song.album);

      if (song.coverArt) {
        img.onerror = () => { img.style.display = 'none'; symbol.style.display = 'inline'; };
        img.src = song.coverArt;
        img.style.display = 'block';
        symbol.style.display = 'none';
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
        symbol.style.display = 'inline';
      }
    }

    function updateToggleIcons(icon) {
      document.getElementById('btn-np-toggle').textContent = icon;
      document.getElementById('btn-big-toggle').textContent = icon;
    }

    function expandBigPlayer() {
      if (currentIndex === -1) return;
      document.getElementById('big-player').classList.add('visible');
    }

    function collapseBigPlayer() {
      document.getElementById('big-player').classList.remove('visible');
    }

    function playTrackByIndex(i) {
      if (i < 0 || i >= songs.length) return;
      document.querySelectorAll('.track-row.playing').forEach(el => el.classList.remove('playing'));
      const row = document.getElementById(`track-row-${i}`);
      if (row) {
        row.classList.add('playing');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      currentIndex = i;
      const song = songs[i];
      audio.src = song.url;
      audio.play();

      document.getElementById('np-title').textContent = song.title;
      document.getElementById('now-playing-bar').classList.add('visible');

      document.getElementById('big-player-title').textContent = song.title;
      document.getElementById('big-player-album').textContent = song.album;
      setBigPlayerArt(song);

      expandBigPlayer();
    }

    function playRandomTrack() {
      if (songs.length === 0) return;
      const randomIdx = Math.floor(Math.random() * songs.length);
      playTrackByIndex(randomIdx);
    }

    function playNextTrack() {
      if (songs.length === 0) return;
      playTrackByIndex((currentIndex + 1) % songs.length);
    }

    function playPrevTrack() {
      if (songs.length === 0) return;
      playTrackByIndex((currentIndex - 1 + songs.length) % songs.length);
    }

    function toggleNowPlaying() {
      if (currentIndex === -1) {
        playRandomTrack();
        return;
      }
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    audio.addEventListener('play', () => updateToggleIcons('⏸'));
    audio.addEventListener('pause', () => updateToggleIcons('▶'));
    audio.addEventListener('ended', playNextTrack);

    loadCatalog();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/kids-sw.js', { scope: '/kids.html' }).catch(err => {
          console.error('Kids Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
