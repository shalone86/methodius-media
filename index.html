<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Methodius Media</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --player-bg: #181818;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #282828;
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .album-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid #333;
      padding-bottom: 0.5rem;
    }

    .album-title { font-size: 1.25rem; color: var(--accent); }
    
    .zip-btn {
      background: #2a2a2a;
      color: var(--text);
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      border: 1px solid #444;
    }
    .zip-btn:hover { background: #333; }

    .track-list { list-style: none; }
    
    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .track-item:hover { background: #282828; }
    .track-item.active { background: #2a2618; color: var(--accent); }

    .track-meta { display: flex; align-items: center; gap: 0.5rem; }
    .tag-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      background: #333;
      color: var(--accent);
      text-transform: uppercase;
    }

    /* Persistent Player */
    #player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: var(--player-bg);
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 1000;
    }

    .player-info { width: 30%; }
    .player-title { font-weight: bold; font-size: 0.95rem; }
    .player-album { font-size: 0.8rem; color: var(--text-muted); }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: 40%;
    }

    .btn-group { display: flex; gap: 1rem; align-items: center; }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .ctrl-btn.play-btn {
      background: var(--accent);
      color: #000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .scrubber-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .scrubber {
      flex-grow: 1;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Methodius Media</h1>
  </header>

  <div class="container" id="catalog-container">
    <p>Loading catalog...</p>
  </div>

  <!-- Persistent Player -->
  <div id="player-bar">
    <div class="player-info">
      <div class="player-title" id="now-playing-title">Select a track</div>
      <div class="player-album" id="now-playing-album">-</div>
    </div>

    <div class="player-controls">
      <div class="btn-group">
        <button class="ctrl-btn" id="prev-btn">⏮</button>
        <button class="ctrl-btn play-btn" id="play-btn">▶</button>
        <button class="ctrl-btn" id="next-btn">⏭</button>
      </div>
      <div class="scrubber-container">
        <span id="current-time">0:00</span>
        <input type="range" id="scrubber" class="scrubber" value="0" min="0" max="100">
        <span id="duration-time">0:00</span>
      </div>
    </div>

    <div style="width: 30%;"></div>
  </div>

  <script>
    const MEDIA_BASE = 'https://media.methodius.media';
    const CATALOG_URL = `${MEDIA_BASE}/catalog.json`;

    let playlist = [];
    let currentIndex = -1;
    const audio = new Audio();

    // DOM Elements
    const catalogContainer = document.getElementById('catalog-container');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const scrubber = document.getElementById('scrubber');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const titleEl = document.getElementById('now-playing-title');
    const albumEl = document.getElementById('now-playing-album');

    async function initCatalog() {
      try {
        const res = await fetch(CATALOG_URL);
        const data = await res.json();
        
        catalogContainer.innerHTML = '';
        playlist = [];

        data.forEach((album) => {
          const albumEl = document.createElement('div');
          albumEl.className = 'album-card';

          const zipHtml = album.zipUrl 
            ? `<a href="${MEDIA_BASE}/${encodeURI(album.zipUrl)}" class="zip-btn" download>Download Album (WAV)</a>` 
            : '';

          let tracksHtml = '';
          album.tracks.forEach((track) => {
            const globalIndex = playlist.length;
            playlist.push({
              title: track.title,
              albumName: album.albumName,
              tag: track.tag,
              url: `${MEDIA_BASE}/${encodeURI(track.path)}`
            });

            const tagHtml = track.tag ? `<span class="tag-badge">${track.tag}</span>` : '';

            tracksHtml += `
              <li class="track-item" data-index="${globalIndex}">
                <div class="track-meta">
                  <span>${track.trackNum !== 999 ? track.trackNum + '.' : ''} ${track.title}</span>
                  ${tagHtml}
                </div>
                <span>▶</span>
              </li>
            `;
          });

          albumEl.innerHTML = `
            <div class="album-header">
              <div class="album-title">${album.albumName}</div>
              ${zipHtml}
            </div>
            <ul class="track-list">${tracksHtml}</ul>
          `;

          catalogContainer.appendChild(albumEl);
        });

        // Track click events
        document.querySelectorAll('.track-item').forEach(item => {
          item.addEventListener('click', () => {
            const index = parseInt(item.getAttribute('data-index'), 10);
            loadTrack(index);
            audio.play();
          });
        });

      } catch (err) {
        catalogContainer.innerHTML = '<p>Error loading catalog. Please try again later.</p>';
        console.error(err);
      }
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const track = playlist[currentIndex];

      audio.src = track.url;
      titleEl.textContent = track.title;
      albumEl.textContent = `${track.albumName} ${track.tag ? '[' + track.tag + ']' : ''}`;

      // Highlight active UI track
      document.querySelectorAll('.track-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentIndex);
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Player Controls
    playBtn.addEventListener('click', () => {
      if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        loadTrack(currentIndex - 1);
        audio.play();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < playlist.length - 1) {
        loadTrack(currentIndex + 1);
        audio.play();
      }
    });

    audio.addEventListener('play', () => playBtn.textContent = '⏸');
    audio.addEventListener('pause', () => playBtn.textContent = '▶');
    audio.addEventListener('ended', () => {
      if (currentIndex < playlist.length - 1) {
        loadTrack(currentIndex + 1);
        audio.play();
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        scrubber.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
      }
    });

    scrubber.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (scrubber.value / 100) * audio.duration;
      }
    });

    initCatalog();
  </script>
</body>
</html>
